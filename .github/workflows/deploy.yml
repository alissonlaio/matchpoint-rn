name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx expo@54.0.33 export --platform web

      - name: Fix paths
        run: |
          sed -i 's|href="/favicon.ico"|href="/matchpoint-rn/favicon.ico"|g' dist/index.html
          sed -i 's|src="/_expo/|src="/matchpoint-rn/_expo/|g' dist/index.html
          sed -i 's|</head>|<link rel="apple-touch-icon" href="/matchpoint-rn/assets/assets/logo.64dbe0f48b90f5dc0d6fa048b1d0da9b.png" /><link rel="manifest" href="/matchpoint-rn/manifest.json" /></head>|g' dist/index.html

      - name: Create manifest
        run: |
          cat > dist/manifest.json << 'EOF'
          {
            "name": "MatchPoint V.T.",
            "short_name": "MatchPoint",
            "start_url": "/matchpoint-rn/",
            "display": "standalone",
            "background_color": "#0a1628",
            "theme_color": "#0a1628",
            "icons": [
              {
                "src": "/matchpoint-rn/assets/assets/logo.64dbe0f48b90f5dc0d6fa048b1d0da9b.png",
                "sizes": "192x192",
                "type": "image/png"
              },
              {
                "src": "/matchpoint-rn/assets/assets/logo.64dbe0f48b90f5dc0d6fa048b1d0da9b.png",
                "sizes": "512x512",
                "type": "image/png"
              }
            ]
          }
          EOF

      - name: Copy assets
        run: |
          mkdir -p dist/assets/assets
          cp assets/logo.png dist/assets/assets/logo.64dbe0f48b90f5dc0d6fa048b1d0da9b.png

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist